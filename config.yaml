# == RENAMED COLUMNS == #
columns_names:
  weather:
    date: mes
    state: uf_loja
    city: cidade_loja
    district: bairro_loja

feature_engineering:
  # 5. Features temporais e de lag (obrigatórias)
  exogen_lag_features:
    lags: [6, 7, 8, 9, 10, 11, 12]
    rolling: [3, 6]
    expanding: True

# == AGG RULES ==
aggregation_rules:
  # Colunas categóricas e como tratá-las automaticamente em qualquer groupby
  categorical:
    # === SEMPRE IGUAIS dentro do grupo → pegar o valor único (first) ===
    first:
      - marca
      - material
      - construcao
      - padronagem
      - decote
      - detalhe
      - regiao_loja
      - uf_loja
      - clima_loja
      - perfil_loja
      - porte_loja

    # === VARIAM dentro do grupo, mas têm uma "principal" → pegar a moda ===
    mode:
      - cor

    # === VARIAM muito → transformar só em contagem de valores únicos ===
    nunique:
      - sku
      - tamanho
      - cidade_loja
      - bairro_loja
  numerical:
    sum:
    - estoque_unidades_inicio
    - estoque_unidades_fim
    - estoque_unidades
    - estoque_unidades_mediana
    - venda_valor_total
    - total_observacoes_vendas
    - pedidos 
    - pedidos_m1
    - pedidos_m2 
    - pedidos_m3
    - pedidos_m4
    - pedidos_m5 
    - pedidos_m6
    - pedidos_m7 
    - pedidos_m8
    - pedidos_m9
    - pedidos_m10
    - pedidos_m11
    - pedidos_m12
    - precipitation_sum
    - rain_sum
    - snowfall_sum
    - shortwave_radiation_sum
  mean:
    - prop_dias_com_estoque
    - prop_dias_com_venda
    - preco_unitario
    - desconto_percentual 
    - desconto_absoluto
    - tem_preco_original
    - temperature_2m_mean
    - apparent_temperature_mean
  max:
    - temperature_2m_max
    - apparent_temperature_max
    - wind_speed_10m_max
    - wind_gusts_10m_max
  min:
    - temperature_2m_min
    - apparent_temperature_min

